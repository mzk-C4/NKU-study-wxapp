# Include INSIDE your existing HTTPS server block; review before applying.
# This file is not a complete server and performs no deployment.
# current/ holds index.html, credits.html, emblem, etc.
# shared-assets/ accumulates hashed assets across releases for old browser sessions.
location = /campus-map {
    return 301 /campus-map/;
}

location ^~ /campus-map/assets/ {
    alias /var/www/nkulawer-campus-map/shared-assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /campus-map/ {
    alias /var/www/nkulawer-campus-map/current/;
    index index.html;
    add_header Cache-Control "no-cache";
}
