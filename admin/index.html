<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NKUStudy 内容管理</title>
  <style>
    :root{--purple:#4b1f6f;--deep:#2b123e;--gold:#d7a63c;--paper:#f7f5f9;--ink:#211c24;--muted:#6b6570;--line:#e8e2ec;--ok:#1e7b53;--danger:#ad2e3f}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
    .top{background:linear-gradient(120deg,var(--deep),var(--purple));color:#fff}.top-inner{max-width:1180px;margin:auto;padding:28px 24px;display:flex;gap:24px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px}.brand img{width:54px;height:54px;border-radius:14px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:#e8dff0}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input{width:220px}
    main{max-width:1180px;margin:24px auto;padding:0 24px 48px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(43,18,62,.05)}.metric{padding:18px}.metric b{font-size:28px;color:var(--purple);display:block}.metric span{color:var(--muted)}
    .tabs{display:flex;gap:8px;margin:24px 0 12px}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:999px}.tab.active{background:var(--purple);border-color:var(--purple);color:#fff}.panel{padding:20px}.section{display:none}.section.active{display:block}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section h2{font-size:19px;margin:0}.muted{color:var(--muted)}
    input,textarea,select{border:1px solid #d9d1df;border-radius:9px;background:#fff;color:var(--ink);padding:10px 12px;min-height:42px}textarea{min-height:92px;resize:vertical}.primary,.secondary,.danger{border-radius:9px;padding:9px 14px;border:1px solid transparent}.primary{background:var(--purple);color:#fff}.secondary{background:#fff;border-color:var(--line);color:var(--purple)}.danger{background:#fff0f2;color:var(--danger);border-color:#f3c9d0}.small{padding:6px 10px;font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid .wide{grid-column:1/-1}.label{display:grid;gap:5px;color:var(--muted);font-size:13px}.cards{display:grid;gap:10px;margin-top:16px}.item{border:1px solid var(--line);border-radius:12px;padding:15px;display:grid;gap:9px}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{font-size:16px;margin:0}.meta{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f0e9f5;color:var(--purple);border-radius:999px;padding:2px 9px;font-size:12px}.chip.gold{background:#fff5dd;color:#76500b}.chip.ok{background:#e8f6ef;color:var(--ok)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:36px;text-align:center;color:var(--muted)}.notice{padding:10px 12px;border-radius:9px;background:#fff8e7;color:#705215;margin-bottom:14px}.toast{position:fixed;right:24px;bottom:24px;background:var(--deep);color:#fff;border-radius:10px;padding:10px 15px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:720px){.top-inner{align-items:flex-start;flex-direction:column}.auth input{width:min(70vw,220px)}.summary,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.item-head{flex-direction:column}.section-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner">
    <div class="brand"><img src="/admin-logo" alt="NKUStudy"><div><h1>NKUStudy 内容管理</h1><p>课程、资料投稿与评价审核</p></div></div>
    <div class="auth"><input id="adminKey" type="password" autocomplete="off" placeholder="输入管理密钥"><button class="primary" id="connect">连接</button></div>
  </div></header>
  <main>
    <div class="notice">管理密钥只保存在当前浏览器本地，不会写入仓库。生产环境应使用 HTTPS，并限制管理端访问来源。</div>
    <section class="summary">
      <div class="metric"><b id="courseCount">—</b><span>课程总数</span></div>
      <div class="metric"><b id="submissionCount">—</b><span>待审核资料</span></div>
      <div class="metric"><b id="reviewCount">—</b><span>待审核评价</span></div>
    </section>
    <nav class="tabs" aria-label="内容类型">
      <button class="tab active" data-tab="courses">课程管理</button>
      <button class="tab" data-tab="submissions">资料审核</button>
      <button class="tab" data-tab="reviews">评价审核</button>
    </nav>
    <div class="panel">
      <section class="section active" id="courses">
        <div class="section-head"><div><h2>课程管理</h2><span class="muted">A–E 分类、课程属性和建议修读阶段分别维护</span></div><button class="secondary" id="toggleCourseForm">新增课程</button></div>
        <form id="courseForm" class="form-grid" hidden>
          <label class="label">课程名称<input name="name" required maxlength="100"></label>
          <label class="label">A–E 分类<select name="category_code"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></label>
          <label class="label">学院<input name="department" maxlength="100"></label>
          <label class="label">课程属性<select name="requirement_type"><option>必修</option><option>选修</option></select></label>
          <label class="label">建议修读阶段<input name="recommended_stage" placeholder="如：大二上" maxlength="40"></label>
          <label class="label">标签（用中文逗号分隔）<input name="tags" placeholder="数学，概率论"></label>
          <label class="label wide">中性课程简介<textarea name="description" maxlength="1000"></textarea></label>
          <div class="actions wide"><button class="primary" type="submit">保存为草稿</button><button class="secondary" type="button" id="cancelCourse">取消</button></div>
        </form>
        <div class="cards" id="courseList"><div class="empty">输入管理密钥后读取数据</div></div>
      </section>
      <section class="section" id="submissions"><div class="section-head"><div><h2>资料审核</h2><span class="muted">通过后自动生成公开资料记录</span></div><button class="secondary refresh">刷新</button></div><div class="cards" id="submissionList"></div></section>
      <section class="section" id="reviews"><div class="section-head"><div><h2>评价审核</h2><span class="muted">公开端始终匿名，评价绑定课程、教师与学期</span></div><button class="secondary refresh">刷新</button></div><div class="cards" id="reviewList"></div></section>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const $ = selector => document.querySelector(selector)
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))
    const statusName = {draft:'草稿',published:'已发布',archived:'已归档',pending:'待审核',approved:'已通过',needs_changes:'需修改',rejected:'未通过',hidden:'已隐藏'}
    let key = localStorage.getItem('nkustudy_admin_key') || ''
    $('#adminKey').value = key
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
    async function api(path, options={}){
      const response=await fetch('/api/v1'+path,{...options,headers:{'content-type':'application/json','x-admin-key':key,...options.headers}})
      const result=await response.json().catch(()=>({message:'响应格式错误'}))
      if(!response.ok||result.code!==0)throw new Error(result.message||'请求失败')
      return result.data
    }
    async function loadSummary(){const data=await api('/admin/summary');$('#courseCount').textContent=data.courses;$('#submissionCount').textContent=data.pending_submissions;$('#reviewCount').textContent=data.pending_reviews}
    async function loadCourses(){const data=await api('/admin/courses');$('#courseList').innerHTML=data.items.length?data.items.map(course=>`<article class="item"><div class="item-head"><div><h3>${escapeHtml(course.name)}</h3><div class="meta"><span class="chip">${escapeHtml(course.category_code)} 类</span><span class="chip gold">${escapeHtml(course.requirement_type||'属性待补')}</span><span class="chip ${course.status==='published'?'ok':''}">${escapeHtml(statusName[course.status]||course.status)}</span></div></div><div class="actions">${course.status!=='published'?`<button class="primary small" data-course="${course.id}" data-status="published">发布</button>`:''}<button class="secondary small" data-course="${course.id}" data-status="archived">归档</button></div></div><div class="muted">${escapeHtml(course.department||'学院待补')} · 建议 ${escapeHtml(course.recommended_stage||'待补充')}</div><div>${escapeHtml(course.description||'暂无简介')}</div></article>`).join(''):'<div class="empty">暂无课程</div>'}
    async function loadSubmissions(){const data=await api('/admin/submissions');const items=data.items.filter(x=>x.status==='pending'||x.status==='needs_changes');$('#submissionList').innerHTML=items.length?items.map(item=>`<article class="item"><div class="item-head"><div><h3>${escapeHtml(item.title)}</h3><div class="meta"><span class="chip">${escapeHtml(item.type)}</span><span class="chip gold">${escapeHtml(item.storage_provider)}</span><span class="chip">${escapeHtml(statusName[item.status]||item.status)}</span></div></div></div><div class="muted">${escapeHtml(item.course_name)} · ${escapeHtml(item.academic_year||'学年待补')}</div><div>${escapeHtml(item.description||'无补充说明')}</div><div class="actions"><button class="primary small" data-submission="${item.id}" data-status="approved">通过</button><button class="secondary small" data-submission="${item.id}" data-status="needs_changes">需修改</button><button class="danger small" data-submission="${item.id}" data-status="rejected">不通过</button></div></article>`).join(''):'<div class="empty">没有待处理的资料投稿</div>'}
    async function loadReviews(){const data=await api('/admin/reviews');const items=data.items.filter(x=>x.status==='pending');$('#reviewList').innerHTML=items.length?items.map(item=>`<article class="item"><div class="item-head"><div><h3>${escapeHtml(item.course_name)} · ${escapeHtml(item.teacher_name)}</h3><div class="meta"><span class="chip">${escapeHtml(item.term_label)}</span><span class="chip gold">推荐 ${item.recommend}/5</span></div></div></div><div>${escapeHtml(item.body)}</div><div class="muted">难度 ${item.difficulty} · 作业量 ${item.workload} · 收获 ${item.gain}</div><div class="actions"><button class="primary small" data-review="${item.id}" data-status="published">通过</button><button class="danger small" data-review="${item.id}" data-status="rejected">不通过</button></div></article>`).join(''):'<div class="empty">没有待处理的课程评价</div>'}
    async function refresh(){try{await Promise.all([loadSummary(),loadCourses(),loadSubmissions(),loadReviews()]);toast('数据已更新')}catch(error){toast(error.message)}}
    $('#connect').onclick=()=>{key=$('#adminKey').value.trim();localStorage.setItem('nkustudy_admin_key',key);refresh()}
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab,.section').forEach(el=>el.classList.remove('active'));tab.classList.add('active');$('#'+tab.dataset.tab).classList.add('active')})
    $('#toggleCourseForm').onclick=()=>{$('#courseForm').hidden=!$('#courseForm').hidden}
    $('#cancelCourse').onclick=()=>{$('#courseForm').reset();$('#courseForm').hidden=true}
    $('#courseForm').onsubmit=async event=>{event.preventDefault();const raw=Object.fromEntries(new FormData(event.currentTarget));raw.tags=raw.tags.split(/[，,]/).map(x=>x.trim()).filter(Boolean);try{await api('/admin/courses',{method:'POST',body:JSON.stringify(raw)});event.currentTarget.reset();event.currentTarget.hidden=true;await refresh()}catch(error){toast(error.message)}}
    document.body.addEventListener('click',async event=>{const button=event.target.closest('[data-course],[data-submission],[data-review]');if(!button)return;try{if(button.dataset.course)await api('/admin/courses/'+button.dataset.course,{method:'PATCH',body:JSON.stringify({status:button.dataset.status})});if(button.dataset.submission)await api('/admin/submissions/'+button.dataset.submission,{method:'PATCH',body:JSON.stringify({status:button.dataset.status,review_note:''})});if(button.dataset.review)await api('/admin/reviews/'+button.dataset.review,{method:'PATCH',body:JSON.stringify({status:button.dataset.status,review_note:''})});await refresh()}catch(error){toast(error.message)}})
    document.querySelectorAll('.refresh').forEach(button=>button.onclick=refresh)
    if(key)refresh()
  </script>
</body>
</html>
